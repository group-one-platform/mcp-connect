name: publish

# Publishing is deliberately tag-driven and CI-only. `id-token: write` is what lets npm
# verify, via OIDC, that the tarball came from THIS repo and THIS workflow — that is the
# provenance badge, and it is also why no npm token is stored anywhere here. Provenance
# requires a public repository; npm refuses it from a private one.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, and Node 22 still bundles npm 10.x. Do not
      # drop this step on the grounds that the runner "already has npm".
      #
      # The failure it prevents is genuinely misleading: npm 10 can still SIGN a provenance
      # statement (supported since 9.5), so the log shows a Sigstore transparency-log entry
      # and looks healthy — and then authenticates with nothing at all, which the registry
      # answers with `404 Not Found - PUT`. That reads as a misconfigured trusted publisher,
      # and sends you to re-check npm settings that were right all along.
      - name: install an npm that can authenticate over OIDC
        run: npm install -g npm@latest
      - run: npm --version

      - run: npm ci

      # The same gates as CI. A release that skipped them would be the one release nobody
      # checked, and it is the one that lands on customers' machines.
      - run: npm run build
      - run: npm test

      - run: npm run package

      # One package per brand, all from the same build. The loop means adding a brand is
      # a row in src/constants.ts plus an entrypoint — never a change to this workflow.
      # Published from INSIDE each directory. `npm publish build/uniweb-connect` looks like
      # npm's `owner/repo` GitHub shorthand and is resolved as a git remote, not a path —
      # it fails with "Repository not found", which reads like a permissions problem and
      # is not one.
      # Each package is independent, so one brand must not be able to block the others:
      # `build/*/` globs alphabetically, and a single misconfigured trusted publisher used
      # to abort the job before later brands were even attempted. Failures are collected
      # and reported at the end instead.
      #
      # Already-published versions are skipped rather than attempted, which is what makes
      # re-running a partially failed release safe — without it the second run dies on
      # "cannot publish over previously published version" for the ones that did succeed.
      - name: publish each brand package
        run: |
          set -uo pipefail
          failed=0
          for dir in build/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")

            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already published — skipping"
              continue
            fi

            echo "::group::publish ${name}@${version}"
            if (cd "${dir}" && npm publish --provenance --access public); then
              echo "published ${name}@${version}"
            else
              echo "::error::${name}@${version} failed to publish"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "${failed}"
